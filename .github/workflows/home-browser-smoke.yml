name: Home Browser Smoke

on:
  push:
    branches: [feat/home-player-tutorial]

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --package-lock=false playwright@1.55.0 three@0.185.0
      - name: Use local Three.js for smoke
        run: sed -i 's#https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js#/node_modules/three/build/three.module.js#' games/scrap-factory/index.html
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/game-http.log 2>&1 &
          sleep 2
      - name: Chromium smoke test
        shell: bash
        run: |
          cat > .tmp-home-browser-smoke.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const origin = 'http://127.0.0.1:4173';
          const url = `${origin}/games/scrap-factory/index.html`;
          const browser = await chromium.launch({ headless: true, channel: 'chrome', args: ['--enable-webgl', '--ignore-gpu-blocklist', '--use-angle=swiftshader'] });
          const viewport = { width: 1440, height: 900 };

          function watch(page, errors) {
            page.on('pageerror', (e) => errors.push(`pageerror: ${e.message}`));
            page.on('console', (m) => {
              const text = m.text();
              if (m.type() === 'error' && !text.startsWith('Failed to load resource:')) errors.push(`console: ${text}`);
            });
            page.on('requestfailed', (r) => errors.push(`requestfailed: ${r.url()} ${r.failure()?.errorText || ''}`));
            page.on('response', (r) => {
              if (r.status() >= 400 && !/\/favicon\.ico(?:\?|$)/.test(r.url())) errors.push(`http ${r.status()}: ${r.url()}`);
            });
          }

          async function waitForBoot(page) {
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForFunction(() => window.__scrapFactoryBooted === true && Boolean(window.__scrapFactoryRuntime), null, { timeout: 15000 });
            await page.waitForSelector('#start-game:not([disabled])', { timeout: 10000 });
            await page.waitForSelector('#home-system-panel', { state: 'attached', timeout: 10000 });
          }

          const context = await browser.newContext({ viewport });
          const page = await context.newPage();
          const errors = [];
          watch(page, errors);
          await waitForBoot(page);

          const initial = await page.evaluate(() => ({
            player: window.__scrapFactoryRuntime.getGame().player,
            homeScene: Boolean(window.__scrapFactoryRuntime.world.scene.getObjectByName('player-home')),
            homePanel: Boolean(document.querySelector('#home-system-panel')),
            homeMarker: Boolean(document.querySelector('#home-marker-chip')),
          }));
          assert.equal(initial.homeScene, true);
          assert.equal(initial.homePanel, true);
          assert.equal(initial.homeMarker, true);
          assert.ok(Math.abs(initial.player.x + 12.2) < 0.01 && Math.abs(initial.player.z - 36.8) < 0.01, 'fresh save starts at Home');

          await page.click('#start-game');
          await page.waitForFunction(() => !document.querySelector('#hud').hidden);
          assert.match(await page.locator('#inventory-slots').innerText(), /\/ 12$/);
          await page.evaluate(() => window.__scrapFactoryRuntime.world.setPlayerState({ x: -10, y: 1.7, z: 27, yaw: Math.PI }));
          await page.waitForTimeout(500);
          await page.screenshot({ path: '/tmp/home-world.png', fullPage: true });
          await page.evaluate(() => window.__scrapFactoryRuntime.world.setPlayerState({ x: -12.2, y: 1.7, z: 36.8, yaw: Math.PI }));

          await page.evaluate(() => window.__scrapFactoryRuntime.world.callbacks.onInteract({ kind: 'home', action: 'door', label: 'Home Door' }));
          assert.equal(await page.evaluate(() => window.__scrapFactoryRuntime.world.homeController.doorOpen), true);
          assert.equal(await page.evaluate(() => window.__scrapFactoryRuntime.world.staticColliders.some((c) => c.homeColliderId === 'home-door')), false);
          await page.evaluate(() => window.__scrapFactoryRuntime.world.callbacks.onInteract({ kind: 'home', action: 'door', label: 'Home Door' }));
          await page.waitForFunction(() => window.__scrapFactoryRuntime.world.staticColliders.some((c) => c.homeColliderId === 'home-door'), null, { timeout: 3000 });

          await page.evaluate(() => window.__scrapFactoryRuntime.world.callbacks.onInteract({ kind: 'home', action: 'bed', label: 'Bed' }));
          await page.waitForTimeout(200);
          const bed = await page.evaluate(() => ({
            home: window.__scrapFactoryRuntime.getGame().home,
            saved: JSON.parse(localStorage.getItem('elitemay-game-hub-v1') || 'null')?.games?.['scrap-factory']?.home,
          }));
          assert.equal(bed.home.respawnEnabled, true);
          assert.ok(bed.home.bedUsedAt);
          assert.equal(bed.saved?.respawnEnabled, true, 'Bed manual save persists');

          await page.evaluate(() => window.__scrapFactoryRuntime.world.callbacks.onInteract({ kind: 'home', action: 'pc', label: 'Player Management PC' }));
          await page.waitForFunction(() => !document.querySelector('#home-system-panel').hidden);
          assert.equal(await page.locator('#home-system-title').innerText(), 'Player Management PC');
          assert.match(await page.locator('#home-system-content').innerText(), /BACKPACK/);
          assert.equal(await page.locator('[data-home-tab="tutorial"]').count(), 1);
          assert.equal(await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 1), false, 'no horizontal overflow');
          await page.screenshot({ path: '/tmp/home-pc.png', fullPage: true });

          const legacyRoot = await page.evaluate(() => {
            const root = JSON.parse(localStorage.getItem('elitemay-game-hub-v1'));
            const game = root.games['scrap-factory'];
            delete game.home;
            game.player = { x: 5, y: 1.7, z: 5, yaw: 0.4 };
            return root;
          });
          if (errors.length) throw new Error(errors.join('\n'));
          await context.close();

          const legacyContext = await browser.newContext({
            viewport,
            storageState: { cookies: [], origins: [{ origin, localStorage: [{ name: 'elitemay-game-hub-v1', value: JSON.stringify(legacyRoot) }] }] },
          });
          const legacyPage = await legacyContext.newPage();
          const legacyErrors = [];
          watch(legacyPage, legacyErrors);
          await waitForBoot(legacyPage);
          const legacy = await legacyPage.evaluate(() => ({
            player: window.__scrapFactoryRuntime.getGame().player,
            worldPlayer: window.__scrapFactoryRuntime.world.getPlayerState(),
            home: window.__scrapFactoryRuntime.getGame().home,
          }));
          assert.ok(Math.abs(legacy.player.x - 5) < 0.01 && Math.abs(legacy.player.z - 5) < 0.01, 'legacy saved position preserved');
          assert.ok(Math.abs(legacy.worldPlayer.x - 5) < 0.01 && Math.abs(legacy.worldPlayer.z - 5) < 0.01, 'legacy world spawn preserved');
          assert.equal(legacy.home.introducedFromLegacy, true);
          if (legacyErrors.length) throw new Error(legacyErrors.join('\n'));

          await legacyContext.close();
          await browser.close();
          console.log('Home Chromium smoke passed.');
          EOF
          node ./.tmp-home-browser-smoke.mjs
          rm -f .tmp-home-browser-smoke.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-browser-smoke
          path: /tmp/home-*.png
          if-no-files-found: ignore
