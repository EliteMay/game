name: Integrate Home Feature Branch

on:
  push:
    branches:
      - feat/home-player-tutorial

permissions:
  contents: write

concurrency:
  group: integrate-home-feature
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/home-player-tutorial
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply runtime integration patches
        run: node scripts/apply-home-feature.mjs
      - name: Validate integrated runtime
        run: npm run validate
      - name: Update implementation documentation
        run: node scripts/apply-home-docs.mjs
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit validated integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md SPEC.md WORK_REPORT.md PROJECT_LEARNINGS.md package.json games/scrap-factory scripts/home-system.test.mjs
          git commit -m "feat: integrate Home player upgrades and tutorial runtime"
          git push origin HEAD:feat/home-player-tutorial
