name: Apply Fresh Spawn Fix

on:
  push:
    branches:
      - fix/fresh-spawn-movement
    paths:
      - .github/workflows/apply-fresh-spawn-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Move fresh spawn out of bed collider and add regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('games/scrap-factory/home-system.js')
          text = home.read_text()
          old = "export const HOME_RESPAWN_POSITION = Object.freeze({ x: -12.2, y: 1.7, z: 36.8, yaw: Math.PI });"
          new = "export const HOME_RESPAWN_POSITION = Object.freeze({ x: -10.25, y: 1.7, z: 36.1, yaw: Math.PI });"
          if old not in text:
              raise SystemExit('expected HOME_RESPAWN_POSITION not found')
          home.write_text(text.replace(old, new, 1))

          test = Path('scripts/home-system.test.mjs')
          text = test.read_text()
          text = text.replace('  HOME_RESPAWN_POSITION,\n', '  HOME_POSITION,\n  HOME_RESPAWN_POSITION,\n', 1)
          marker = "function makeInventory(amount = 50) {"
          regression = """{
  const playerRadius = 0.42;
  const bed = {
    minX: HOME_POSITION.x - 2.65 - 3.25 / 2,
    maxX: HOME_POSITION.x - 2.65 + 3.25 / 2,
    minZ: HOME_POSITION.z + 1.6 - 1.6 / 2,
    maxZ: HOME_POSITION.z + 1.6 + 1.6 / 2,
  };
  const p = HOME_RESPAWN_POSITION;
  const overlapsBed = p.x + playerRadius > bed.minX
    && p.x - playerRadius < bed.maxX
    && p.z + playerRadius > bed.minZ
    && p.z - playerRadius < bed.maxZ;
  assert.equal(overlapsBed, false, 'fresh/Home respawn must not overlap the bed collider');
}

"""
          if regression not in text:
              text = text.replace(marker, regression + marker, 1)
          test.write_text(text)
          PY
      - name: Validate
        run: npm run validate
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-fresh-spawn-fix.yml
          git add games/scrap-factory/home-system.js scripts/home-system.test.mjs
          git commit -m 'fix: keep fresh spawn clear of Home bed collider'
          git push
