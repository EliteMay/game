name: Finalize Post Clear Optimization

on:
  push:
    branches:
      - feat/post-clear-optimization

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize source and documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'anchor missing in {path}: {old[:80]}')
              p.write_text(text.replace(old, new, 1))

          # Remove one unused import discovered during final review.
          replace_once(
              'games/scrap-factory/post-clear-optimization.js',
              "import { BUILDINGS } from './config.js';\nimport { analyzeFinalAutomation } from './final-automation.js';",
              "import { analyzeFinalAutomation } from './final-automation.js';",
          )

          replace_once(
              'README.md',
              '`Scrap Factory` は **Final Phase: Mega Factory Stability / Main Clear** まで通常Gameplayへ接続しています。',
              '`Scrap Factory` は **Post Clear: Factory Optimization Objectives** まで通常Gameplayへ接続しています。',
          )
          replace_once(
              'README.md',
              '→ MAIN CLEAR\n→ 同じSaveでFactory Optimization継続',
              '→ MAIN CLEAR\n→ KでFactory Optimization\n→ Post Clear Objectives 4種\n→ OPTIMIZATION MASTERED\n→ 同じSaveでFactory Optimization継続',
          )
          replace_once(
              'README.md',
              '残っている主要作業:\n\n1. Clear後Optimization / Challengeの拡張\n2. final Hybrid Asset / Lighting / VFX / LOD quality pass\n3. Mega FactoryのBrowser / Performance / Visual / Balance検証',
              '残っている主要作業:\n\n1. Factory Optimization / Challengeのlong-term content追加\n2. final Hybrid Asset / Lighting / VFX / LOD quality pass\n3. Mega FactoryのBrowser / Performance / Visual / Balance検証',
          )
          marker = 'Main Clear後も同じSaveで工場を拡張・最適化できます。\n'
          section = '''Main Clear後も同じSaveで工場を拡張・最適化できます。\n\n## Post Clear Factory Optimization\n\nMain Clear確認後は **K** でFactory Optimization Panelを開けます。Rank 8や新通貨は追加しません。\n\n- **POWER HEADROOM** — Power状態OK + 240以上の余力\n- **BUFFER RESERVE** — Factory Storage 3,600容量 + 1,800以上の空き\n- **LOGISTICS BACKBONE** — Conveyor Mk.3 18基 + Priority/Overflow 4基 + Logistics Warehouse 2基\n- **REDUNDANT AUTOMATION** — Final Automation維持 + Experimental Power 2基 + Advanced Drone Port 6基\n\n4 / 4達成で `OPTIMIZATION MASTERED` を履歴保存します。達成後にFactoryを組み替えても達成履歴は失われません。\n'''
          readme = Path('README.md')
          text = readme.read_text()
          if '## Post Clear Factory Optimization' not in text:
              if marker not in text:
                  raise SystemExit('README post-clear section anchor missing')
              readme.write_text(text.replace(marker, section, 1))

          replace_once('WORK_REPORT.md', 'Date: 2026-09-05', 'Date: 2026-09-06')
          replace_once(
              'WORK_REPORT.md',
              '`Scrap Factory` は **Final Phase: Mega Factory Stability / Main Clear** まで実装。',
              '`Scrap Factory` は **Post Clear: Factory Optimization Objectives** まで実装。',
          )
          replace_once(
              'WORK_REPORT.md',
              '→ MAIN CLEAR\n→ same SaveでFactory Optimization継続',
              '→ MAIN CLEAR\n→ Factory Optimization Objectives\n→ OPTIMIZATION MASTERED\n→ same SaveでFactory Optimization継続',
          )
          replace_once(
              'WORK_REPORT.md',
              '### Post Clear / Optimization\n- clear-after Optimization objectivesの拡張\n- Factory Optimization / Challengeのlong-term content',
              '### Post Clear / Optimization\n- Core Factory Optimization Objectives 4種は実装済み\n- Factory Optimization / Challengeのlong-term content追加は今後の拡張対象',
          )
          verification_old = 'Implementation branchの`npm run validate`で既存RegressionとPost Clear unit/contract testsを実行する。Browser / Visual確認はFinal commitのVerification Stateへ別途記録する。'
          verification_new = '''Final successful validation:\n\n```text\nPost Clear Browser Smoke #5\nRun: 33998104085\nHead: 99de3908fe800bc4ef2ea83d724550aaaaeb607d\nResult: success\n```\n\n確認済み:\n\n- 現行headで `npm run validate` 成功\n- Main Clear確認済みSaveでOPTIMIZE HUDが解放\n- Pointer Lock中に `K` でFactory Optimization Panelを開ける\n- 4 Objectiveと現在進捗を表示\n- `K` / `Escape` でPanelを閉じられる\n- Objective達成履歴を保存し、Reload後も `1 / 4` を保持\n- 1440×900でpage-level horizontal overflowなし\n- page error / meaningful console error / request failureなし\n\n### Visual Review\n\nNoto CJKを導入したChromium Screenshotを確認。既存Factory OSの工業UIと整合し、4 Objectiveのタイトル・進捗バー・現在条件が判読可能で、横overflowや大きなレイアウト崩れは見られなかった。\n\nBrowser Smoke用Workflowは検証後に削除し、恒久実装だけをPRへ残す。'''
          replace_once('WORK_REPORT.md', verification_old, verification_new)
          PY
          rm .github/workflows/finalize-post-clear.yml
      - name: Validate final branch
        run: npm run validate
      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize post-clear optimization implementation"
          git push
