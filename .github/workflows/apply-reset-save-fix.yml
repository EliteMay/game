name: Apply Reset Save Fix

on:
  push:
    branches:
      - fix/reset-save-resurrection

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reset guard and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, found {s.count(old)} for {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          game_path = 'games/scrap-factory/game.js'
          replace_once(
              game_path,
              "let beforeUnloadSaved = false;\nconst transportCredits = new Map();",
              "let beforeUnloadSaved = false;\nlet resetInProgress = false;\nconst transportCredits = new Map();",
          )
          replace_once(
              game_path,
              """  ui.resetButton.addEventListener('click', () => {\n    const ok = window.confirm('Scrap Factoryのセーブを初期化します。元に戻せません。よろしいですか？');\n    if (!ok) return;\n    resetGameSave();\n    window.location.reload();\n  });""",
              """  ui.resetButton.addEventListener('click', () => {\n    const ok = window.confirm('Scrap Factoryのセーブを初期化します。元に戻せません。よろしいですか？');\n    if (!ok) return;\n    resetInProgress = true;\n    beforeUnloadSaved = true;\n    started = false;\n    resetGameSave();\n    window.location.reload();\n  });""",
          )
          replace_once(
              game_path,
              """  window.addEventListener('beforeunload', () => {\n    if (beforeUnloadSaved) return;\n    beforeUnloadSaved = true;\n    try { persist('ページ終了'); } catch { /* browser shutdown best effort */ }\n  });\n  document.addEventListener('visibilitychange', () => {\n    if (document.visibilityState === 'hidden' && started) persist('バックグラウンド移行');\n  });""",
              """  window.addEventListener('beforeunload', () => {\n    if (resetInProgress || beforeUnloadSaved) return;\n    beforeUnloadSaved = true;\n    try { persist('ページ終了'); } catch { /* browser shutdown best effort */ }\n  });\n  document.addEventListener('visibilitychange', () => {\n    if (resetInProgress) return;\n    if (document.visibilityState === 'hidden' && started) persist('バックグラウンド移行');\n  });""",
          )
          replace_once(
              game_path,
              "function persist(reason = 'autosave') {\n  game.player = world.getPlayerState();",
              "function persist(reason = 'autosave') {\n  if (resetInProgress) return;\n  game.player = world.getPlayerState();",
          )

          storage_path = 'games/scrap-factory/storage.js'
          replace_once(
              storage_path,
              "let runtimeRootRef = null;\nlet runtimeGameRef = null;",
              "let runtimeRootRef = null;\nlet runtimeGameRef = null;\n\nconst SCRAP_FACTORY_AUXILIARY_STORAGE_KEYS = Object.freeze([\n  'scrap-factory-management-v1',\n]);",
          )
          replace_once(
              storage_path,
              """export function resetGameSave() {\n  const root = loadRootSave();\n  root.games['scrap-factory'] = makeDefaultGameSave();\n  runtimeGameRef = null;\n  runtimeRootRef = null;\n  return saveRootSave(root);\n}""",
              """export function resetGameSave() {\n  const root = loadRootSave();\n  root.games['scrap-factory'] = makeDefaultGameSave();\n  runtimeGameRef = null;\n  runtimeRootRef = null;\n  const saved = saveRootSave(root);\n  for (const key of SCRAP_FACTORY_AUXILIARY_STORAGE_KEYS) {\n    try { localStorage.removeItem(key); } catch { /* best effort */ }\n  }\n  return saved;\n}""",
          )

          test_path = Path('scripts/reset-save.test.mjs')
          test_path.write_text(r'''import assert from 'node:assert/strict';
import fs from 'node:fs';

const gameSource = fs.readFileSync(new URL('../games/scrap-factory/game.js', import.meta.url), 'utf8');
const storageSource = fs.readFileSync(new URL('../games/scrap-factory/storage.js', import.meta.url), 'utf8');

assert.match(gameSource, /let resetInProgress = false;/, 'reset state guard must exist');
assert.match(gameSource, /resetInProgress = true;[\s\S]*beforeUnloadSaved = true;[\s\S]*started = false;[\s\S]*resetGameSave\(\);[\s\S]*window\.location\.reload\(\);/, 'reset must block late saves before reloading');
assert.match(gameSource, /if \(resetInProgress \|\| beforeUnloadSaved\) return;/, 'beforeunload must not restore the pre-reset save');
assert.match(gameSource, /document\.addEventListener\('visibilitychange',[\s\S]*if \(resetInProgress\) return;/, 'visibilitychange autosave must be blocked during reset');
assert.match(gameSource, /function persist\(reason = 'autosave'\) \{\n  if \(resetInProgress\) return;/, 'persist must be a no-op once destructive reset begins');
assert.match(storageSource, /'scrap-factory-management-v1'/, 'factory-management auxiliary state must be included in reset');
assert.match(storageSource, /localStorage\.removeItem\(key\)/, 'auxiliary Scrap Factory state must be removed');

console.log('Reset-save resurrection regression checks passed.');
''')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          validate = package['scripts']['validate']
          command = 'node scripts/reset-save.test.mjs'
          if command not in validate:
              package['scripts']['validate'] = validate + ' && ' + command
          package['scripts']['test:reset-save'] = command
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Validate
        run: |
          npm run validate
          git diff --check
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/scrap-factory/game.js games/scrap-factory/storage.js scripts/reset-save.test.mjs package.json
          git commit -m 'fix: prevent reset save resurrection'
          git push
