name: Phase 7 Finalize Documentation

on:
  push:
    branches: [feat/phase7-visual-performance-polish]
    paths:
      - 'scripts/phase7-finalize-docs.mjs'
      - '.github/workflows/phase7-finalize-docs.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase7-visual-performance-polish
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update current documentation
        run: node scripts/phase7-finalize-docs.mjs
      - name: Commit documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md SPEC.md WORK_REPORT.md PROJECT_LEARNINGS.md
          if git diff --cached --quiet; then
            echo 'No documentation changes required.'
          else
            git commit -m 'docs: record Phase 7 visual and performance completion'
            git push origin HEAD:feat/phase7-visual-performance-polish
          fi
