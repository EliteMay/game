name: Append Reset Save Docs

on:
  push:
    branches:
      - fix/reset-save-resurrection
    paths:
      - .github/workflows/append-reset-save-docs.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Append bugfix report and learning
        run: |
          python3 - <<'PY'
          from pathlib import Path

          work = Path('WORK_REPORT.md')
          work_text = work.read_text()
          marker = '## 2026-09-06 — Save Reset Resurrection Bug Fix'
          if marker not in work_text:
              work.write_text(work_text.rstrip() + '''\n\n## 2026-09-06 — Save Reset Resurrection Bug Fix\n\n### Symptom\n\nSettingsの「Scrap Factoryのセーブを初期化」で確認後にReloadしても、削除前の進行データが復活することがあった。\n\n### Root Cause\n\n`resetGameSave()` 自体はDefault Saveを書き込んでいたが、その直後の `window.location.reload()` で `beforeunload` / `visibilitychange` が発火し、`game.js` が保持している削除前のruntime objectを `saveGameSave()` で再保存していた。\n\n```text\nReset button\n→ Default Save write\n→ reload\n→ page lifecycle autosave\n→ stale runtime state write\n→ old progress resurrected\n```\n\n### Fix\n\n- `storage.js` に `resetPendingReload` guardを追加\n- Reset成功後からReload完了まで `saveGameSave()` のlate writeを拒否\n- `scrap-factory-management-v1` のFactory Management補助stateもReset時に削除\n- Save key / Schema v1 / Rank 1〜7 / Main Clear等の既存Contractは変更しない\n- `scripts/reset-save.test.mjs` を通常Validationへ追加\n\n### Verification\n\n- PR #22の `npm run validate`: success\n- Chromium Browser Smoke Run `33998751546`: success\n- 進行済みfixture（$9999 / Revenue 12345 / Scrap 77 / Main Clear済み）を保存\n- Reset buttonを実行し自動Reload\n- Reload後 `$40 / Revenue 0 / Scrap 0 / Main Clear null` を確認\n- Factory Management補助state削除を確認\n- さらに2回目Reload後も `$40` のままで旧Saveが復活しないことを確認\n- temporary Browser Smoke workflowは検証後に削除\n''')

          learn = Path('PROJECT_LEARNINGS.md')
          learn_text = learn.read_text()
          learn_marker = '## Destructive reset must block late lifecycle writes'
          if learn_marker not in learn_text:
              learn.write_text(learn_text.rstrip() + '''\n\n## Destructive reset must block late lifecycle writes\n\nReset / Deleteは「新しいDefaultを書けば終わり」ではない。Web Appでは `beforeunload`、`visibilitychange`、Autosave、別Moduleのpolling等が直後に走り、削除前runtime stateを再保存できる。\n\n今回のScrap Factoryでは `resetGameSave()` がDefault Saveを書いた直後、Reloadに伴うpage lifecycle saveが古い `game` objectを再保存し、Resetを取り消していた。\n\n再発防止Pattern:\n\n```text\nconfirm destructive reset\n→ canonical reset write succeeds\n→ mark reset-pending / write barrier\n→ reject all stale late writes\n→ clear feature-local auxiliary storage\n→ reload / recreate runtime\n```\n\n重要点:\n\n- Reset後のwrite barrierはUI event単位ではなくStorage layerに置くと、複数のsave入口をまとめて防げる。\n- Reset本体の書込が失敗した場合に先にauxiliary stateだけ消さない。Canonical Save成功後にbarrierとcleanupを有効化する。\n- Regression TestではReset結果だけでなく、**Reset後に意図的にstale saveを1回実行しても旧Dataが復活しないこと**を確認する。\n- Browser Smokeでは実際のReset button → reload → 再読込を通し、lifecycle eventを含めて検証する。\n''')
          PY
      - name: Validate
        run: npm run validate
      - name: Commit documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORK_REPORT.md PROJECT_LEARNINGS.md
          git commit -m 'docs: record reset-save resurrection fix'
          git push
