name: Phase 7 Settings Review

on:
  push:
    branches: [feat/phase7-settings-polish]
    paths:
      - 'games/scrap-factory/phase7-settings.js'
      - 'games/scrap-factory/phase7-settings.css'
      - 'games/scrap-factory/progression-ui.js'
      - 'scripts/phase7-settings-review.mjs'
      - '.github/workflows/phase7-settings-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser review dependencies
        run: npm install --no-save --package-lock=false three@0.185.0 puppeteer-core@24.16.0
      - name: Use local Three.js in CI checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('games/scrap-factory/index.html')
          text = path.read_text()
          text = text.replace('https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js', '/node_modules/three/build/three.module.js')
          path.write_text(text)
          PY
      - name: Start local site
        run: |
          python3 -m http.server 4173 > /tmp/game-phase7-server.log 2>&1 &
          sleep 1
      - name: Review Phase 7 settings in Chromium
        run: node scripts/phase7-settings-review.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-settings-review-${{ github.run_number }}
          path: artifacts/phase7-settings-review/
          if-no-files-found: warn
