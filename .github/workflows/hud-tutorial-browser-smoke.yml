name: HUD Tutorial Browser Smoke

on:
  push:
    branches:
      - fix/hud-tutorial-hotkeys
    paths:
      - .github/workflows/hud-tutorial-browser-smoke.yml

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate branch
        run: npm run validate
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright@1.55.0 three@0.185.0
          npx playwright install --with-deps chromium
      - name: Localize Three.js for test checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('games/scrap-factory/index.html')
          s = p.read_text()
          s = s.replace('https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js', '/node_modules/three/build/three.module.js')
          p.write_text(s)
          PY
      - name: Verify HUD layout and panel hotkeys
        run: |
          python3 -m http.server 4173 > /tmp/game-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1536, height: 864 } });
          const pageErrors = [];
          page.on('pageerror', (error) => pageErrors.push(String(error)));

          await page.goto('http://127.0.0.1:4173/games/scrap-factory/index.html', { waitUntil: 'networkidle' });
          await page.waitForFunction(() => window.__scrapFactoryBooted && window.__scrapFactoryRuntime?.world);
          await page.click('#start-game');
          await page.waitForFunction(() => document.pointerLockElement === document.querySelector('#game-canvas'), null, { timeout: 10000 });
          await page.waitForSelector('.home-marker-chip', { state: 'visible' });

          const layout = await page.evaluate(() => {
            const rect = (selector) => {
              const r = document.querySelector(selector).getBoundingClientRect();
              return { left: r.left, right: r.right, top: r.top, bottom: r.bottom };
            };
            return {
              objective: rect('.objective-panel'),
              home: rect('.home-marker-chip'),
              topLeft: rect('.hud__top-left'),
            };
          });
          const intersects = (a, b) => !(a.right <= b.left || a.left >= b.right || a.bottom <= b.top || a.top >= b.bottom);
          assert.equal(intersects(layout.objective, layout.home), false, 'HOME marker must not overlap Contract HUD');
          assert.ok(layout.home.top >= layout.topLeft.bottom + 4, `HOME marker should sit below top-left HUD; ${JSON.stringify(layout)}`);

          await page.keyboard.press('b');
          await page.waitForSelector('#build-panel:not([hidden])');
          const buildReminder = page.locator('#build-panel .panel-tutorial-reminder');
          await buildReminder.waitFor({ state: 'visible' });
          assert.equal(await buildReminder.locator('[data-panel-toggle-key]').textContent(), 'B');
          assert.ok((await buildReminder.locator('[data-panel-tutorial-title]').textContent()).trim().length > 0);
          assert.ok((await buildReminder.locator('[data-panel-tutorial-body]').textContent()).trim().length > 0);
          await page.screenshot({ path: 'hud-tutorial-build.png', fullPage: true });

          await page.keyboard.press('b');
          await page.waitForSelector('#build-panel', { state: 'hidden' });
          await page.waitForFunction(() => document.pointerLockElement === document.querySelector('#game-canvas'), null, { timeout: 10000 });

          await page.keyboard.press('Tab');
          await page.waitForSelector('#inventory-panel:not([hidden])');
          const inventoryReminder = page.locator('#inventory-panel .panel-tutorial-reminder');
          await inventoryReminder.waitFor({ state: 'visible' });
          assert.equal(await inventoryReminder.locator('[data-panel-toggle-key]').textContent(), 'Tab');
          await page.keyboard.press('Tab');
          await page.waitForSelector('#inventory-panel', { state: 'hidden' });
          await page.waitForFunction(() => document.pointerLockElement === document.querySelector('#game-canvas'), null, { timeout: 10000 });

          await page.keyboard.press('o');
          await page.waitForSelector('#guide-panel:not([hidden])');
          await page.keyboard.press('o');
          await page.waitForSelector('#guide-panel', { state: 'hidden' });
          await page.waitForFunction(() => document.pointerLockElement === document.querySelector('#game-canvas'), null, { timeout: 10000 });

          assert.deepEqual(pageErrors, [], 'page errors: ' + pageErrors.join('\n'));
          console.log('HUD tutorial browser smoke passed', layout);
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hud-tutorial-browser-smoke
          path: hud-tutorial-build.png
          if-no-files-found: ignore

# rerun after HOME marker spacing adjustment
